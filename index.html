<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutina de Verónica</title>
<meta name="description" content="Rutina semanal, cumpleaños, caminata y biblioteca de música para Verónica.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FF8A3D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="styles.css">
<style>
  /* Estilos de emergencia, independientes de styles.css: si ese archivo
     también falla en cargar, este aviso igual se tiene que ver bien. */
  #fatalError{ display:none; position:fixed; inset:0; background:rgba(255,248,238,0.97); align-items:center; justify-content:center; z-index:9999; padding:24px; font-family:sans-serif; }
  #fatalError:not([hidden]){ display:flex; }
  #fatalError .fatal-error-card{ background:#fff; border-radius:20px; padding:28px 24px; max-width:340px; text-align:center; box-shadow:0 12px 30px rgba(0,0,0,0.2); }
  #fatalError .fatal-error-emoji{ font-size:40px; margin-bottom:8px; }
  #fatalError .fatal-error-title{ font-size:18px; font-weight:700; color:#4A3B47; margin-bottom:8px; }
  #fatalError .fatal-error-text{ font-size:14px; color:#4A3B47; margin-bottom:16px; line-height:1.4; }
  #fatalError button{ font-size:14px; font-weight:700; padding:10px 20px; border-radius:12px; border:none; background:#FF8A3D; color:#fff; cursor:pointer; }
</style>
<script>
  // Red de seguridad: si algo de la app falla al cargar (un archivo que
  // no llega, un error temprano), muestra un aviso claro en vez de dejar
  // la pantalla en blanco. Corre antes que logic.js/app.js y no depende
  // de que ellos carguen bien.
  (function(){
    function showFatalError(){
      var el = document.getElementById('fatalError');
      if (el) el.hidden = false;
    }
    window.addEventListener('error', function(ev){
      if (ev && ev.filename && /\/(logic|app)\.js/.test(ev.filename)) showFatalError();
    }, true);
    window.addEventListener('load', function(){
      setTimeout(function(){
        if (!window.__appBooted) showFatalError();
      }, 6000);
    });
  })();
</script>
</head>
<body>
<div id="fatalError" hidden role="alert">
  <div class="fatal-error-card">
    <div class="fatal-error-emoji" aria-hidden="true">😕</div>
    <div class="fatal-error-title">Algo no cargó bien</div>
    <div class="fatal-error-text">Probá recargar la página. Si sigue sin andar, avisale a quien te ayudó a instalar la app.</div>
    <button type="button" onclick="location.reload()">🔄 Recargar</button>
  </div>
</div>
<div id="confettiField" aria-hidden="true"></div>
<div class="wrap">
  <header class="app-header">
    <div class="vinyl-mini" aria-hidden="true"></div>
    <div class="app-header-id">
      <div class="app-header-name-row" id="userNameRow">
        <h1 id="userNameDisplay" class="app-header-name">Verónica</h1>
        <button type="button" id="userNameEditBtn" class="app-header-name-edit" aria-label="Editar nombre">✏️</button>
      </div>
      <input type="text" id="userNameInput" class="app-header-name-input" hidden aria-label="Nombre" maxlength="40">
      <div class="app-header-sub">Cuarteto a pleno · Euge Quevedo</div>
    </div>
    <div id="weatherCard" class="weather-card" hidden></div>
  </header>

  <div id="dayTabsWrap">
    <div class="daytabs" id="dayTabs" role="tablist" aria-label="Días de la semana"></div>
    <div id="streakBadge" class="streak-badge" hidden></div>
    <div id="streakForgiveHint" class="streak-forgive-hint" hidden></div>
  </div>

  <div id="dayContent" role="tabpanel"></div>
  <div id="srAnnouncer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <footer>
    <p>Tocá o presioná Enter en cada casillero para marcarlo como hecho 🎧<br>¡A puro ritmo toda la semana!</p>
    <div class="backup-actions">
      <button type="button" id="exportBtn" class="backup-btn">⬇️ Exportar datos</button>
      <button type="button" id="importBtn" class="backup-btn">⬆️ Importar datos</button>
      <input type="file" id="importFile" accept="application/json" hidden>
      <button type="button" id="reminderBtn" class="backup-btn" hidden>🔔 Activar recordatorios</button>
    </div>
    <p id="reminderStatus" class="reminder-status" role="status" aria-live="polite"></p>
    <div id="noticeDaysWrap" class="notice-days-wrap" hidden>
      <label for="noticeDaysInput">🎂 Avisar cumpleaños con</label>
      <select id="noticeDaysInput">
        <option value="1">1 día</option>
        <option value="2">2 días</option>
        <option value="3">3 días</option>
        <option value="4">4 días</option>
        <option value="5">5 días</option>
        <option value="6">6 días</option>
        <option value="7">7 días</option>
      </select>
      <span>de anticipación</span>
    </div>
    <div id="phrasesSection"></div>
  </footer>
</div>

<nav class="bottom-nav" id="bottomNav" role="tablist" aria-label="Secciones de la app"></nav>

<script src="logic.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
