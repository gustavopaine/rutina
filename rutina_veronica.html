<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutina de Verónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --cream:#FFF8EE;
    --card:#FFFFFF;
    --card-tint:#FFF3E4;
    --orange:#FF8A3D;
    --orange-deep:#F26A1B;
    --gold:#FFC145;
    --teal:#2FD9C4;
    --teal-deep:#14B39E;
    --pink:#FF5FA8;
    --pink-deep:#E83D8C;
    --violet:#A487F5;
    --violet-deep:#8360E8;
    --ink:#4A3B47;
    --text:#4A3B47;
    --text-soft:#9A8794;
    --shadow: 0 12px 26px -12px rgba(242,106,27,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 10% 8%, rgba(255,138,61,0.35), transparent 45%),
      radial-gradient(circle at 90% 12%, rgba(164,135,245,0.30), transparent 45%),
      radial-gradient(circle at 15% 88%, rgba(47,217,196,0.30), transparent 45%),
      radial-gradient(circle at 90% 85%, rgba(255,95,168,0.30), transparent 45%),
      linear-gradient(160deg, var(--cream), #FFF1E0 45%, var(--cream));
    background-size:200% 200%,200% 200%,200% 200%,200% 200%,100% 100%;
    animation: driftBg 16s ease-in-out infinite;
    font-family:'Nunito', sans-serif;
    color:var(--text);
    padding:28px 16px 60px;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  .stage-scene{
    position:fixed;
    left:0; right:0; top:0;
    height:340px;
    z-index:0;
    pointer-events:none;
    opacity:1;
  }
  .stage-scene svg{ animation: sceneSway 8s ease-in-out infinite; transform-origin:top center; }
  @keyframes sceneSway{
    0%,100%{ transform:scale(1) rotate(0deg); }
    50%{ transform:scale(1.03) rotate(0.6deg); }
  }
  .confetti-fall{
    position:fixed;
    top:-40px;
    pointer-events:none;
    z-index:0;
    animation: confettiDrop linear infinite;
  }
  @keyframes confettiDrop{
    0%{ transform:translateY(0) rotate(0deg); opacity:0.9; }
    100%{ transform:translateY(110vh) rotate(380deg); opacity:0.2; }
  }
  @keyframes driftBg{
    0%{background-position:0% 0%,100% 0%,0% 100%,100% 100%,0 0;}
    50%{background-position:25% 30%,75% 15%,15% 80%,80% 90%,0 0;}
    100%{background-position:0% 0%,100% 0%,0% 100%,100% 100%,0 0;}
  }
  .wrap{max-width:560px;margin:0 auto;position:relative; z-index:1;}

  .note{
    position:fixed;
    pointer-events:none;
    opacity:0.6;
    animation: floatUp 6s ease-in-out infinite;
    z-index:0;
  }
  @keyframes floatUp{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-20px) rotate(14deg); }
  }

  header{text-align:center; margin-bottom:24px; position:relative; z-index:1;}
  .vinyl{
    width:70px; height:70px; margin:0 auto 10px;
    border-radius:50%;
    background:
      radial-gradient(circle at center, #FFF8EE 0 8px, #fff 8px 10px, #FFF8EE 10px 11px, transparent 11px),
      conic-gradient(from 0deg, var(--orange), var(--pink), var(--violet), var(--teal), var(--gold), var(--orange));
    box-shadow:0 10px 24px -8px rgba(242,106,27,0.5), 0 0 0 4px #fff, 0 0 0 6px var(--pink);
    animation: spinVinyl 3.5s linear infinite;
  }
  @keyframes spinVinyl{ to{ transform:rotate(360deg); } }
  .beams{
    position:absolute;
    top:-30px; left:50%;
    transform:translateX(-50%);
    width:340px; height:180px;
    z-index:-1;
    opacity:0.55;
    animation: sweepBeams 5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sweepBeams{
    0%,100%{ transform:translateX(-50%) rotate(-4deg); }
    50%{ transform:translateX(-50%) rotate(4deg); }
  }
  .soundbars{
    display:flex; align-items:flex-end; justify-content:center;
    gap:4px; height:20px; margin:6px auto 0;
  }
  .soundbars span{
    display:inline-block;
    width:4px;
    border-radius:3px;
    background:linear-gradient(180deg, var(--pink), var(--orange));
    animation: bounceBar 0.9s ease-in-out infinite;
  }
  .soundbars span:nth-child(1){ height:8px; animation-delay:0s; background:linear-gradient(180deg, var(--teal), var(--teal-deep)); }
  .soundbars span:nth-child(2){ height:16px; animation-delay:.15s; background:linear-gradient(180deg, var(--pink), var(--pink-deep)); }
  .soundbars span:nth-child(3){ height:11px; animation-delay:.3s; background:linear-gradient(180deg, var(--gold), var(--orange-deep)); }
  .soundbars span:nth-child(4){ height:18px; animation-delay:.1s; background:linear-gradient(180deg, var(--violet), var(--violet-deep)); }
  .soundbars span:nth-child(5){ height:9px; animation-delay:.25s; background:linear-gradient(180deg, var(--orange), var(--orange-deep)); }
  @keyframes bounceBar{
    0%,100%{ transform:scaleY(0.5); }
    50%{ transform:scaleY(1.6); }
  }

  .kicker{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:13px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    background:linear-gradient(90deg, var(--orange), var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:4px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:32px;
    margin:0;
    line-height:1.1;
  }
  h1 span{
    background:linear-gradient(90deg, var(--pink-deep), var(--orange), var(--gold));
    background-size:200% auto;
    animation: textShine 4s ease infinite;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  @keyframes textShine{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  .sub{
    margin-top:8px;
    font-size:14px;
    color:var(--text-soft);
    font-weight:700;
  }

  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:6px 2px 14px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:10px 14px;
    border-radius:16px;
    background:var(--card);
    color:var(--orange-deep);
    box-shadow:0 3px 10px -6px rgba(242,106,27,0.3);
    cursor:pointer;
    transition:all .18s ease;
    white-space:nowrap;
  }
  .tab:hover{ transform:translateY(-2px); }
  .tab.active{
    color:#fff;
    box-shadow:var(--shadow);
    transform:translateY(-3px) scale(1.04);
  }
  .tab.bdaytab{ background:#F2E7FF; color:var(--violet-deep); }

  .day-banner{
    border-radius:22px;
    padding:16px 20px;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:var(--shadow);
    margin-bottom:16px;
    background-size:300% 300%;
    animation: shimmer 6s ease infinite;
  }
  @keyframes shimmer{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .day-banner .name{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:22px; }
  .day-banner .tag{
    font-size:12px; font-weight:700;
    background:rgba(255,255,255,0.25);
    padding:6px 12px; border-radius:12px;
  }

  .progress-wrap{
    background:var(--card);
    border-radius:20px;
    padding:12px 16px;
    display:flex; align-items:center; gap:12px;
    margin-bottom:18px;
  }
  .progress-track{ flex:1; height:10px; background:#FFE7CC; border-radius:8px; overflow:hidden; }
  .progress-fill{
    height:100%;
    background-size:200% 100%;
    animation: fillShine 3s linear infinite;
    width:0%; transition:width .25s ease; border-radius:8px;
  }
  @keyframes fillShine{ 0%{background-position:0% 0%;} 100%{background-position:200% 0%;} }
  .progress-label{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:13px; white-space:nowrap; }

  .block{
    background:var(--card);
    border-radius:20px;
    padding:16px 18px 8px;
    margin-bottom:16px;
    box-shadow:0 6px 18px -12px rgba(0,0,0,0.4);
    transition: transform .18s ease, box-shadow .18s ease;
    animation: popIn .35s ease backwards;
  }
  .block:hover{ transform:translateY(-3px); }
  .block:nth-child(2){ animation-delay:.05s; }
  .block:nth-child(3){ animation-delay:.1s; }
  .block:nth-child(4){ animation-delay:.15s; }
  @keyframes popIn{ from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }

  .block-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .block-head .emoji{ font-size:20px; animation: wiggle 2.6s ease-in-out infinite; }
  @keyframes wiggle{ 0%,100%{transform:rotate(0);} 25%{transform:rotate(-10deg);} 75%{transform:rotate(10deg);} }
  .block-head h2{ font-family:'Baloo 2', sans-serif; font-size:16.5px; margin:0; flex:1; }
  .block-head .time{
    font-size:12px; font-weight:800; color:#fff;
    padding:4px 10px; border-radius:10px;
  }

  .item{
    display:flex; align-items:center; gap:12px;
    padding:9px 4px;
    border-bottom:1px dashed #FFE1C7;
    cursor:pointer; user-select:none;
    border-radius:10px;
    transition: background .15s ease, transform .1s ease;
  }
  .item:hover{ background:#FFF3E4; transform:translateX(2px); }
  .item:last-child{ border-bottom:none; }
  .checkbox{
    width:23px; height:23px; border-radius:8px;
    border:2.5px solid var(--orange);
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    transition:all .18s cubic-bezier(.34,1.56,.64,1);
  }
  .checkbox svg{ opacity:0; transition:opacity .12s ease; }
  .item.done .checkbox svg{ opacity:1; }
  .item.done .checkbox{ transform:scale(1.12) rotate(-6deg); }
  .item-text{ font-size:14.5px; font-weight:700; color:var(--text); flex:1; }
  .item.done .item-text{ color:var(--text-soft); text-decoration:line-through; text-decoration-color:var(--orange); }
  .item-emoji{ font-size:16px; transition:transform .18s ease; }
  .item.done .item-emoji{ transform:scale(1.25) rotate(8deg); }

  .item.special{ border-radius:12px; margin:2px 0; padding:9px 8px; background:rgba(255,122,61,0.12); box-shadow:inset 0 0 0 1.5px rgba(255,122,61,0.4); }
  .item.special.walk{ background:rgba(58,222,192,0.12); box-shadow:inset 0 0 0 1.5px rgba(58,222,192,0.45); }
  .item.special.wa{ background:rgba(139,107,255,0.14); box-shadow:inset 0 0 0 1.5px rgba(139,107,255,0.5); }
  .item.special .item-text{ font-weight:800; }

  /* Birthdays reused */
  .bday-hero{
    border-radius:22px; padding:18px 20px; color:#fff;
    box-shadow:var(--shadow); margin-bottom:16px;
    position:relative; overflow:hidden;
    background-size:300% 300%;
    animation: shimmer 7s ease infinite;
  }
  .bday-hero::before{ content:"🎉"; position:absolute; font-size:60px; opacity:0.18; right:-8px; top:-14px; animation: wiggle 4s ease-in-out infinite; }
  .bday-hero .eyebrow{ font-size:12px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; opacity:0.85; margin-bottom:4px; }
  .bday-hero .who{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:24px; margin-bottom:2px; }
  .bday-hero .when{ font-size:13.5px; font-weight:700; opacity:0.92; }
  .bday-hero .countdown{
    display:inline-block; margin-top:10px; background:rgba(255,255,255,0.22);
    padding:6px 12px; border-radius:12px; font-size:12.5px; font-weight:800;
    animation: pulseSoft 1.8s ease-in-out infinite;
  }
  @keyframes pulseSoft{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }

  .month-header{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:14px;
    color:var(--orange-deep); text-transform:uppercase; letter-spacing:1px; margin:18px 4px 8px;
  }
  .month-header:first-of-type{ margin-top:4px; }

  .bday-item{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border-radius:16px; padding:11px 14px; margin-bottom:8px;
    box-shadow:0 4px 14px -10px rgba(0,0,0,0.4);
    transition: transform .15s ease;
  }
  .bday-item:hover{ transform:translateX(3px); }
  .bday-date{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:17px; color:#fff;
    background:linear-gradient(135deg, var(--orange), var(--pink));
    border-radius:12px; width:44px; height:44px;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .bday-info{ flex:1; min-width:0; }
  .bday-name{ font-size:14.5px; font-weight:800; color:var(--text); }
  .bday-tag{ display:inline-block; margin-top:2px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:8px; color:#fff; }
  .bday-days{ font-size:11.5px; font-weight:800; color:var(--text-soft); white-space:nowrap; text-align:right; }
  .bday-item.today{ box-shadow:0 0 0 2px var(--orange); animation: glowPulse 1.6s ease-in-out infinite; }
  @keyframes glowPulse{ 0%,100%{box-shadow:0 0 0 2px rgba(255,122,61,0.4);} 50%{box-shadow:0 0 0 2px rgba(255,122,61,0.9);} }

  footer{ text-align:center; margin-top:26px; font-size:12.5px; color:var(--text-soft); font-weight:600; }

  /* Caminata */
  .tab.walktab{ background:#DFFAF4; color:var(--teal-deep); }
  .walk-banner{
    border-radius:22px; padding:16px 20px; color:#fff;
    box-shadow:var(--shadow); margin-bottom:14px;
    background:linear-gradient(120deg, var(--teal), var(--teal-deep), var(--teal));
    background-size:300% 300%; animation: shimmer 6s ease infinite;
  }
  .walk-banner .name{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:20px; }
  .walk-banner .note{ font-size:12.5px; font-weight:600; opacity:0.95; margin-top:4px; line-height:1.4; }

  #walkMap{
    width:100%; height:230px; border-radius:18px; margin-bottom:14px;
    box-shadow:0 6px 18px -10px rgba(0,0,0,0.25);
    background:#E7F7F3;
  }

  .walk-stats{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:10px;
    margin-bottom:14px;
  }
  .walk-stat{
    background:var(--card);
    border-radius:16px;
    padding:12px 14px;
    box-shadow:0 4px 14px -10px rgba(74,59,71,0.2);
  }
  .walk-stat .label{ font-size:11px; font-weight:800; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.5px; }
  .walk-stat .value{ font-family:'Baloo 2', sans-serif; font-size:20px; font-weight:800; color:var(--ink); margin-top:2px; }

  .walk-mode{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:800; padding:8px 14px;
    border-radius:14px; margin-bottom:14px;
    background:#EAF7F3; color:var(--teal-deep);
    transition:background .2s ease, color .2s ease;
  }
  .walk-mode.vehicle{ background:#FFE9DC; color:var(--orange-deep); }

  .walk-btn{
    width:100%;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:15.5px;
    padding:14px;
    border:none;
    border-radius:16px;
    color:#fff;
    cursor:pointer;
    box-shadow:var(--shadow);
    background:linear-gradient(120deg, var(--teal), var(--teal-deep));
    margin-bottom:16px;
    transition:transform .15s ease;
  }
  .walk-btn:active{ transform:scale(0.98); }
  .walk-btn.stop{ background:linear-gradient(120deg, var(--pink), var(--pink-deep)); }

  .walk-history-title{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:14px;
    color:var(--teal-deep); text-transform:uppercase; letter-spacing:1px; margin:8px 4px 8px;
  }
  .walk-session{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border-radius:16px; padding:11px 14px; margin-bottom:8px;
    box-shadow:0 4px 14px -10px rgba(74,59,71,0.2);
  }
  .walk-session .icon{
    width:40px; height:40px; border-radius:12px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:18px;
    background:linear-gradient(135deg, var(--teal), var(--teal-deep)); color:#fff;
  }
  .walk-session.vehicle .icon{ background:linear-gradient(135deg, var(--orange), var(--orange-deep)); }
  .walk-session .info{ flex:1; min-width:0; }
  .walk-session .date{ font-size:13px; font-weight:800; color:var(--ink); }
  .walk-session .detail{ font-size:12px; color:var(--text-soft); font-weight:600; }
  .walk-empty{ text-align:center; color:var(--text-soft); font-size:13px; font-weight:600; padding:16px; }

  /* Biblioteca */
  .tab.libtab{ background:#F1EBFF; color:var(--violet-deep); }
  .lib-banner{
    border-radius:22px; padding:16px 20px; color:#fff;
    box-shadow:var(--shadow); margin-bottom:16px;
    background:linear-gradient(120deg, var(--violet), var(--violet-deep), var(--violet));
    background-size:300% 300%; animation: shimmer 6s ease infinite;
  }
  .lib-banner .name{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:20px; }
  .lib-banner .note{ font-size:12.5px; font-weight:600; opacity:0.95; margin-top:4px; line-height:1.4; }

  .lib-section-title{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:14px;
    color:var(--violet-deep); text-transform:uppercase; letter-spacing:1px; margin:18px 4px 10px;
  }
  .lib-section-title:first-of-type{ margin-top:4px; }

  .lib-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:8px;
  }
  .lib-card{
    display:flex; flex-direction:column; gap:8px;
    background:var(--card);
    border-radius:16px;
    padding:14px;
    text-decoration:none;
    box-shadow:0 4px 14px -10px rgba(74,59,71,0.25);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .lib-card:hover{ transform:translateY(-3px); box-shadow:0 10px 20px -12px rgba(74,59,71,0.35); }
  .lib-card .lib-icon{
    width:36px; height:36px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; color:#fff;
  }
  .lib-card .lib-title{ font-size:13px; font-weight:800; color:var(--ink); line-height:1.25; }

  .lib-form{
    background:var(--card);
    border-radius:18px;
    padding:14px;
    margin-bottom:14px;
    box-shadow:0 4px 14px -10px rgba(74,59,71,0.2);
  }
  .lib-form input, .lib-form select{
    width:100%;
    font-family:'Nunito', sans-serif;
    font-size:14px;
    font-weight:700;
    padding:10px 12px;
    border-radius:12px;
    border:2px solid #EEE5FA;
    margin-bottom:8px;
    color:var(--ink);
    background:#FBF8FF;
  }
  .lib-form input:focus, .lib-form select:focus{ outline:none; border-color:var(--violet); }
  .lib-add-btn{
    width:100%;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:14.5px;
    padding:12px;
    border:none;
    border-radius:12px;
    color:#fff;
    cursor:pointer;
    background:linear-gradient(120deg, var(--violet), var(--violet-deep));
  }
  .lib-add-btn:active{ transform:scale(0.98); }

  .lib-item{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border-radius:16px; padding:11px 14px; margin-bottom:8px;
    box-shadow:0 4px 14px -10px rgba(74,59,71,0.2);
  }
  .lib-item a{ flex:1; min-width:0; text-decoration:none; display:flex; align-items:center; gap:12px; }
  .lib-item .lib-item-icon{
    width:38px; height:38px; border-radius:11px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:17px; color:#fff;
    background:linear-gradient(135deg, var(--violet), var(--violet-deep));
  }
  .lib-item .lib-item-info{ min-width:0; }
  .lib-item .lib-item-title{ font-size:13.5px; font-weight:800; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lib-item .lib-item-type{ font-size:11px; color:var(--text-soft); font-weight:700; }
  .lib-item .lib-del{
    flex:0 0 auto; width:30px; height:30px; border-radius:10px; border:none;
    background:#FFE9F1; color:var(--pink-deep); font-weight:800; cursor:pointer; font-size:14px;
  }
  .lib-empty{ text-align:center; color:var(--text-soft); font-size:13px; font-weight:600; padding:14px; }

function daysUntilInfo(month, day){
  const today = new Date(); today.setHours(0,0,0,0);
  let year = today.getFullYear();
  let target = new Date(year, month-1, day); target.setHours(0,0,0,0);
  if (target < today) target = new Date(year+1, month-1, day);
  const diff = Math.round((target - today) / 86400000);
  return { diff, target };
}
function getSortedBirthdays(){
  return BIRTHDAYS.map(b => {
    const info = daysUntilInfo(b.month, b.day);
    return { ...b, diff: info.diff, targetMonth: info.target.getMonth() };
  }).sort((a,b) => a.diff - b.diff);
}

  });
}

function totalItems(day){ return day.blocks.reduce((s,b)=>s+b.items.length,0); }

// ---- Caminata en vivo (GPS + mapa gratuito OpenStreetMap/Leaflet) ----
const STRIDE_M = 0.75; // largo de paso promedio para estimar pasos
const VEHICLE_SPEED_KMH = 8; // por encima de esto, se asume vehículo
const DEFAULT_CENTER = [-40.8135, -62.9967]; // Viedma, Río Negro (punto de partida por defecto)
const STORAGE_KEY = 'veronica-walks-history';

let walkMap = null, walkPolyline = null, walkMarker = null;
let walkWatchId = null, walkTracking = false;
let walkPath = [], walkStartTime = null, walkTimerInterval = null;
let walkHistory = [];
let walkCurrentMode = 'walking'; // 'walking' | 'vehicle'

function haversine(a, b){
  const R = 6371000;
  const dLat = (b.lat - a.lat) * Math.PI/180;
  const dLng = (b.lng - a.lng) * Math.PI/180;
  const la1 = a.lat * Math.PI/180, la2 = b.lat * Math.PI/180;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
}

function formatDuration(ms){
  const totalSec = Math.floor(ms/1000);
  const m = Math.floor(totalSec/60);
  const s = totalSec % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

async function loadWalkHistory(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    walkHistory = raw ? JSON.parse(raw) : [];
  }catch(e){ walkHistory = []; }
}

async function saveWalkHistory(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(walkHistory)); }
  catch(e){ console.error('No se pudo guardar el historial', e); }
}

function renderWalkHistory(){
  const histEl = document.getElementById('walkHistoryList');
  if (!histEl) return;
  if (!walkHistory.length){
    histEl.innerHTML = '<div class="walk-empty">Todavía no registraste ninguna caminata 🚶‍♀️</div>';
    return;
  }
  histEl.innerHTML = '';
  [...walkHistory].reverse().slice(0, 15).forEach(sess => {
    const row = document.createElement('div');
    row.className = 'walk-session' + (sess.mode==='vehicle' ? ' vehicle' : '');
    row.innerHTML = `
      <div class="icon">${sess.mode==='vehicle' ? '🚗' : '🚶‍♀️'}</div>
      <div class="info">
        <div class="date">${sess.dateLabel}</div>
        <div class="detail">${sess.distanceKm} km · ${sess.durationLabel} · ${sess.steps} pasos aprox.</div>
      </div>
    `;
    histEl.appendChild(row);
  });
}

function initWalkMap(){
  const el = document.getElementById('walkMap');
  if (!el || typeof L === 'undefined') return;
  walkMap = L.map(el, { zoomControl:true, attributionControl:true }).setView(DEFAULT_CENTER, 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(walkMap);
  walkPolyline = L.polyline([], { color:'#14B39E', weight:5 }).addTo(walkMap);
}

function updateWalkStatsUI(){
  const dist = walkPath.reduce((sum, p, i) => i===0 ? 0 : sum + haversine(walkPath[i-1], p), 0);
  const distKm = (dist/1000).toFixed(2);
  const elapsed = walkStartTime ? Date.now() - walkStartTime : 0;
  const steps = Math.round(dist / STRIDE_M);
  const paceMinPerKm = dist > 0 ? (elapsed/60000) / (dist/1000) : 0;

  const distEl = document.getElementById('walkDistance');
  const timeEl = document.getElementById('walkTime');
  const stepsEl = document.getElementById('walkSteps');
  const paceEl = document.getElementById('walkPace');
  if (distEl) distEl.textContent = distKm + ' km';
  if (timeEl) timeEl.textContent = formatDuration(elapsed);
  if (stepsEl) stepsEl.textContent = steps.toLocaleString('es-AR');
  if (paceEl) paceEl.textContent = (dist>0 && paceMinPerKm>0 && paceMinPerKm<60) ? paceMinPerKm.toFixed(1)+' min/km' : '--';

  // Detección de modo por velocidad sostenida (últimos puntos)
  const recent = walkPath.slice(-4);
  if (recent.length >= 2){
    const recentDist = haversine(recent[0], recent[recent.length-1]);
    const recentTimeH = (recent[recent.length-1].t - recent[0].t) / 3600000;
    const speedKmh = recentTimeH > 0 ? recentDist/1000/recentTimeH : 0;
    walkCurrentMode = speedKmh > VEHICLE_SPEED_KMH ? 'vehicle' : 'walking';
  }
  const modeEl = document.getElementById('walkModeBadge');
  if (modeEl){
    modeEl.className = 'walk-mode' + (walkCurrentMode==='vehicle' ? ' vehicle' : '');
    modeEl.textContent = walkCurrentMode==='vehicle' ? '🚗 Se detectó movimiento en vehículo' : '🚶‍♀️ Caminando';
  }

  return { distKm, elapsed, steps };
}

function startWalk(){
  if (!navigator.geolocation){
    alert('Este navegador no tiene acceso a GPS/ubicación.');
    return;
  }
  walkPath = [];
  walkStartTime = Date.now();
  walkTracking = true;
  if (walkPolyline) walkPolyline.setLatLngs([]);

  walkWatchId = navigator.geolocation.watchPosition((pos) => {
    const p = { lat: pos.coords.latitude, lng: pos.coords.longitude, t: Date.now() };
    walkPath.push(p);
    if (walkMap){
      walkMap.setView([p.lat, p.lng], walkMap.getZoom() < 14 ? 16 : walkMap.getZoom());
      walkPolyline.addLatLng([p.lat, p.lng]);
      if (!walkMarker){
        walkMarker = L.circleMarker([p.lat, p.lng], { radius:7, color:'#fff', weight:2, fillColor:'#FF5FA8', fillOpacity:1 }).addTo(walkMap);
      } else {
        walkMarker.setLatLng([p.lat, p.lng]);
      }
    }
    updateWalkStatsUI();
  }, (err) => {
    console.error(err);
    alert('No pude acceder a la ubicación. Revisá los permisos del navegador.');
  }, { enableHighAccuracy:true, maximumAge:2000, timeout:10000 });

  walkTimerInterval = setInterval(updateWalkStatsUI, 1000);
  renderWalkControls();
}

async function stopWalk(){
  if (walkWatchId !== null) navigator.geolocation.clearWatch(walkWatchId);
  if (walkTimerInterval) clearInterval(walkTimerInterval);
  walkTracking = false;
  walkWatchId = null;

  const { distKm, elapsed, steps } = updateWalkStatsUI();
  if (parseFloat(distKm) > 0.01){
    const session = {
      dateLabel: new Date().toLocaleDateString('es-AR', { weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }),
      distanceKm: distKm,
      durationLabel: formatDuration(elapsed),
      steps: steps.toLocaleString('es-AR'),
      mode: walkCurrentMode,
    };
    walkHistory.push(session);
    await saveWalkHistory();
    renderWalkHistory();
  }
  walkMarker = null;
  renderWalkControls();
}

function renderWalkControls(){
  const btnWrap = document.getElementById('walkBtnWrap');
  if (!btnWrap) return;
  if (walkTracking){
    btnWrap.innerHTML = `<button class="walk-btn stop" id="walkStopBtn">⏹ Detener caminata</button>`;
    document.getElementById('walkStopBtn').onclick = stopWalk;
  } else {
    btnWrap.innerHTML = `<button class="walk-btn" id="walkStartBtn">▶ Iniciar caminata</button>`;
    document.getElementById('walkStartBtn').onclick = startWalk;
  }
}

async function renderWalk(){
  const wrap = document.getElementById('dayContent');
  wrap.innerHTML = `
    <div class="walk-banner">
      <div class="name">📍 Caminata en vivo</div>
      <div class="note">Usa el GPS del celular y un mapa gratuito (OpenStreetMap). Necesitás dar permiso de ubicación y mantener esta pantalla abierta mientras caminás — no funciona en segundo plano.</div>
    </div>
    <div id="walkMap"></div>
    <div class="walk-mode" id="walkModeBadge">🚶‍♀️ Esperando inicio…</div>
    <div class="walk-stats">
      <div class="walk-stat"><div class="label">Distancia</div><div class="value" id="walkDistance">0.00 km</div></div>
      <div class="walk-stat"><div class="label">Tiempo</div><div class="value" id="walkTime">0:00</div></div>
      <div class="walk-stat"><div class="label">Pasos aprox.</div><div class="value" id="walkSteps">0</div></div>
      <div class="walk-stat"><div class="label">Ritmo</div><div class="value" id="walkPace">--</div></div>
    </div>
    <div id="walkBtnWrap"></div>
    <div class="walk-history-title">Historial de caminatas</div>
    <div id="walkHistoryList"></div>
  `;
  initWalkMap();
  renderWalkControls();
  await loadWalkHistory();
  renderWalkHistory();
}

async function loadLibrary(){

  }catch(e){ libraryItems = []; }
}
async function saveLibrary(){

function renderLibraryItems(){

  el.innerHTML = '';

      <a href="${item.url}" target="_blank" rel="noopener">

async function addLibraryItem(){
  const titleEl = document.getElementById('libTitleInput');
  const urlEl = document.getElementById('libUrlInput');
  const typeEl = document.getElementById('libTypeInput');
  const title = titleEl.value.trim();
  let url = urlEl.value.trim();
  if (!title || !url) { alert('Completá el nombre y el link.'); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  libraryItems.push({ id: Date.now().toString(), title, url, type: typeEl.value });
  await saveLibrary();
  titleEl.value = ''; urlEl.value = '';
  renderLibraryItems();
}

function renderDay(){
  const day = DATA[current];
  const wrap = document.getElementById('dayContent');
  wrap.innerHTML = '';
  const [c1, c2] = DAY_COLORS[current];

  const banner = document.createElement('div');
  banner.className = 'day-banner';
  banner.style.background = `linear-gradient(120deg, ${c1}, ${c2}, ${c1})`;
  banner.innerHTML = `<div class="name">${day.label}</div><div class="tag">${day.tag}</div>`;
  wrap.appendChild(banner);

  const progWrap = document.createElement('div');
  progWrap.className = 'progress-wrap';
  progWrap.innerHTML = `<div class="progress-track"><div class="progress-fill" id="progFill" style="background:linear-gradient(90deg, ${c1}, ${c2}, ${c1});"></div></div><div class="progress-label" id="progLabel" style="color:${c1}">0/0</div>`;
  wrap.appendChild(progWrap);

  day.blocks.forEach((block, bIdx) => {
    const el = document.createElement('div');
    el.className = 'block';
    el.style.borderLeft = `4px solid ${c1}`;
    el.innerHTML = `<div class="block-head">
        <span class="emoji">${block.emoji}</span>
        <h2>${block.title}</h2>
        <span class="time" style="background:linear-gradient(120deg, ${c1}, ${c2})">${block.time}</span>
      </div>`;
    block.items.forEach((item, iIdx) => {
      const key = bIdx+'-'+iIdx;
      const isDone = state[current].has(key);
      const row = document.createElement('div');
      row.className = 'item' + (item.special?' special':'') + (item.walk?' walk':'') + (item.wa?' wa':'') + (isDone?' done':'');
      row.innerHTML = `
        <div class="checkbox" style="${isDone ? `background:linear-gradient(135deg, ${c1}, ${c2}); border-color:${c1};` : `border-color:${c1};`}"><svg width="12" height="10" viewBox="0 0 12 10" fill="none"><path d="M1 5L4.5 8.5L11 1.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <span class="item-emoji">${item.e}</span>
        <span class="item-text">${item.t}</span>`;
      row.onclick = (ev) => {
        if (state[current].has(key)) { state[current].delete(key); }
        else { state[current].add(key); burstConfetti(ev.clientX, ev.clientY); }
        saveCheckState();
        renderDay();
      };
      el.appendChild(row);
    });
    wrap.appendChild(el);
  });

  const total = totalItems(day);
  const done = state[current].size;
  document.getElementById('progFill').style.width = (total? (done/total*100):0) + '%';
  document.getElementById('progLabel').textContent = done + '/' + total;
}

// Confeti cayendo de forma continua desde arriba
const FALL_COLORS = ['#FF5FA8','#FFC145','#2FD9C4','#A487F5','#FF8A3D'];
const FALL_SHAPES = ['🎊','🎉','●','▮'];
function spawnFallingConfetti(){
  const field = document.getElementById('confettiField');
  const n = window.innerWidth < 480 ? 14 : 22;
  for (let i=0; i<n; i++){
    const c = document.createElement('div');
    c.className = 'confetti-fall';
    const shape = FALL_SHAPES[Math.floor(Math.random()*FALL_SHAPES.length)];
    if (shape === '●' || shape === '▮'){
      c.textContent = shape;
      c.style.color = FALL_COLORS[Math.floor(Math.random()*FALL_COLORS.length)];
      c.style.fontSize = (8 + Math.random()*8) + 'px';
    } else {
      c.textContent = shape;
      c.style.fontSize = (12 + Math.random()*10) + 'px';
    }
    c.style.left = Math.random()*100 + 'vw';
    c.style.animationDuration = (9 + Math.random()*8) + 's';
    c.style.animationDelay = (Math.random()*10) + 's';
    c.style.opacity = 0.5 + Math.random()*0.4;
    field.appendChild(c);
  }
}
spawnFallingConfetti();

const CONFETTI_EMOJIS = ['🎉','🎶','✨','🔥'];
function burstConfetti(x, y){
  for (let i=0; i<10; i++){
    const c = document.createElement('div');
    c.textContent = CONFETTI_EMOJIS[Math.floor(Math.random()*CONFETTI_EMOJIS.length)];
    c.style.position = 'fixed';
    c.style.left = x + 'px';
    c.style.top = y + 'px';
    c.style.fontSize = (12 + Math.random()*10) + 'px';
    c.style.pointerEvents = 'none';
    c.style.zIndex = 999;
    const angle = Math.random()*Math.PI*2;
    const dist = 40 + Math.random()*50;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 20;
    c.animate([
      { transform:'translate(0,0) scale(1)', opacity:1 },
      { transform:`translate(${dx}px, ${dy}px) scale(0.4)`, opacity:0 }
    ], { duration: 650 + Math.random()*300, easing:'cubic-bezier(.22,.61,.36,1)' });
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1000);
  }
}
